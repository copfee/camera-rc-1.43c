name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/project.py test
      - if: runner.os == 'Linux'
        run: |
          python -m pip install clang-format==20.1.8
          python tools/project.py format-check
  firmware:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .tools
            managed_components
          key: idf-5.5.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.lock', 'main/idf_component.yml') }}
      - run: python tools/project.py setup
      - run: python tools/project.py build
      - run: python tools/project.py package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: firmware-${{ runner.os }}
          path: dist/*.zip

